name: Building Blocks 

on:
  push:
    branches:
      -main
      
jobs:
  echo-hello:
    runs-on: ubuntu-latest
    steps:
      - name: Echo hello
        run: echo "Hello, World!"
  echo-goodbye:
    runs-on: ubuntu-latest
    steps:
      - name: Failed Step
        run: 
              echo "Goodbye, World!"
              exit 1
        name: Say goodbye
        run:  echo "Goodbye, World!"